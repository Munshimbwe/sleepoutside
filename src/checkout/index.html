<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <script src="../js/checkout.js" type="module" defer></script>
</head>
<body>
  <main class="divider">
  <!-- Wayfinding Banner -->
  <div class="checkout-wayfinding">
    <span>1. Cart</span> &rarr;
    <span class="active">2. Shipping & Payment</span> &rarr;
    <span>3. Confirmation</span>
  </div>

  <h2>Checkout</h2>

  <form name="checkout" id="checkout-form">
    <!-- Shipping Section -->
    <fieldset>
      <legend>Shipping Address</legend>

      <div class="form-row">
        <div class="form-control">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required />
        </div>
        <div class="form-control">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required />
        </div>
      </div>

      <div class="form-control">
        <label for="street">Street Address</label>
        <input type="text" id="street" name="street" required />
      </div>

      <div class="form-row-3">
        <div class="form-control">
          <label for="city">City</label>
          <input type="text" id="city" name="city" required />
        </div>
        <div class="form-control">
          <label for="state">State</label>
          <input type="text" id="state" name="state" required />
        </div>
        <div class="form-control">
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" required />
        </div>
      </div>
    </fieldset>

    <!-- Payment Section -->
    <fieldset>
      <legend>Payment Details</legend>

      <div class="form-control">
        <label for="cardNumber">Card Number</label>
        <input 
          type="text" 
          id="cardNumber" 
          name="cardNumber" 
          placeholder="1234567890123456" 
          required 
        />
      </div>

      <div class="form-row">
        <div class="form-control">
          <label for="expiration">Expiration (MM/YY)</label>
          <input 
            type="text" 
            id="expiration" 
            name="expiration" 
            placeholder="12/26" 
            required 
          />
        </div>
        <div class="form-control">
          <label for="code">Security Code (CVC)</label>
          <input 
            type="text" 
            id="code" 
            name="code" 
            placeholder="123" 
            required 
          />
        </div>
      </div>
    </fieldset>

    <!-- Summary Section -->
    <fieldset class="order-summary">
      <legend>Order Summary</legend>
      <div class="summary-row">
        <span>Item Subtotal:</span>
        <span id="subtotal">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Shipping Estimate:</span>
        <span id="shipping">$0.00</span>
      </div>
      <div class="summary-row">
        <span>Tax (6%):</span>
        <span id="tax">$0.00</span>
      </div>
      <div class="summary-row total">
        <span>Order Total:</span>
        <span id="orderTotal">$0.00</span>
      </div>
    </fieldset>

    <button type="submit" id="checkoutSubmit">Submit Order</button>
  </form>
</main>
</body>
</html>
