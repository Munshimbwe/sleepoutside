<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <script src="../js/checkout.js" type="module" defer></script>
</head>
<body>
  <main class="checkout-container">
    <h2>Checkout</h2>
    
    <!-- Order Summary Section -->
    <section class="order-summary">
      <h3>Order Summary</h3>
      <p>Subtotal: <span id="subtotal">$0.00</span></p>
      <p>Tax (6%): <span id="tax">$0.00</span></p>
      <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
      <p><strong>Order Total: <span id="orderTotal">$0.00</span></strong></p>
    </section>

    <!-- Checkout Form -->
    <form id="checkout-form" name="checkout">
      <fieldset>
        <legend>Customer Name</legend>
        <label>
          First Name:
          <input type="text" name="fname" required />
        </label>
        <label>
          Last Name:
          <input type="text" name="lname" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Address</legend>
        <label>
          Street Address:
          <input type="text" name="street" required />
        </label>
        <label>
          City:
          <input type="text" name="city" required />
        </label>
        <label>
          State:
          <input type="text" name="state" required />
        </label>
        <label>
          Zip Code:
          <input type="text" id="zip" name="zip" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Payment</legend>
        <label>
          Credit Card Number:
          <input type="text" name="cardNumber" placeholder="1234123412341234" required />
        </label>
        <label>
          Expiration Date:
          <input type="text" name="expiration" placeholder="12/26" required />
        </label>
        <label>
          Security Code:
          <input type="text" name="code" placeholder="123" required />
        </label>
      </fieldset>

      <button type="submit" id="checkout-btn">Checkout</button>
    </form>
  </main>
</body>
</html>
