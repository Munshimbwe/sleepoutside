<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Cart</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/cart.js" type="module"></script>
  </head>
  <body>
    <!-- Dynamic Header Target -->
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>My Cart</h2>
        <ul class="product-list">
          <!-- Dynamic cart items rendered here -->
        </ul>
        <div class="cart-footer hide">
          <p class="cart-total">Total: $0.00</p>
          <a href="../checkout/index.html" class="checkout-btn">Proceed to Checkout</a>
        </div>
      </section>
    </main>

    <!-- Dynamic Footer Target -->
    <footer id="main-footer"></footer>
  </body>
</html>
